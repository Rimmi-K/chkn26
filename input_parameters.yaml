# ============================================================================
# CONFIGURATION FILE FOR METABOLIC FLUX ANALYSIS DIFFERENTIAL PATHWAY FLUX ANALYSIS (DPFA)
# ============================================================================

paths:
  base_model: "data/models/iES1470.xml"
  pathway_database: "data/models/subsystem_matrix.csv"
  base_output_dir: "results/fluxomics"

tissues:
  - tissue: "breast"
    slow_model: "data/models/context_specific/mcs_slow_breast_fraction_0.65.json"
    fast_model: "data/models/context_specific/mcs_fast_breast_fraction_0.85.json"
    deg_csv: "data/transcriptomics/degs/degs_results_breast.csv"

  - tissue: "leg"
    slow_model: "data/models/context_specific/mcs_slow_leg_fraction_0.30.json"
    fast_model: "data/models/context_specific/mcs_fast_leg_fraction_0.75.json"
    deg_csv: "data/transcriptomics/degs/degs_results_leg.csv"

  - tissue: "liver"
    slow_model: "data/models/context_specific/mcs_slow_liver_fraction_0.50.json"
    fast_model: "data/models/context_specific/mcs_fast_liver_fraction_0.50.json"
    deg_csv: "data/transcriptomics/degs/degs_results_liver.csv"

# ============================================================================
# ANALYSIS PARAMETERS
# ============================================================================
analysis:
  drf_threshold: 0.2               # Threshold for type of increased and decreased DRF
  fdr_threshold: 0.99              # FDR threshold for DEG significance
  flux_diff_threshold: 0.0         # Minimum flux difference for analysis
  secretion_threshold: 1.0e-6      # Threshold for exchange reactions

  # GPR processing
  gpr_missing_strategy: "impute"   # "impute" or "drop"
  gpr_impute_value: 0.0            # Value for missing genes 

# ============================================================================
# VISUALIZATION PARAMETERS
# ============================================================================
visualization:
  # Pathway legend
  legend_ncol: 2
  legend_filename: "global_legend_pathways.pdf"

  # DRF bar plots
  drf_figsize: [12, 8]
  drf_min_bar_width: 0.3
  drf_max_bar_width: 1.5
  drf_xlim_max: 70  
  flux_diff_threshold: 0.00000001  # Minimum |flux_difference| for pathway to be shown in DRF plots

  # Heatmaps
  heatmap_figsize: [14, 10]
  heatmap_cmap: "RdBu_r"
  heatmap_center: 0

scatter:
  # Thresholds for highlighting points
  rxn_lfc_threshold: 0.6           # Reaction log2FC threshold
  flux_threshold: 0.37              # Flux log2 ratio threshold

  # Marker sizes 
  size_mode: "discrete"            # "discrete" or "continuous"
  size_thresholds: [0.001, 0.01, 0.05, 0.25]
  size_values: [175, 150, 100, 50]
  size_default: 25

  # GPR annotations
  gpr_na_token: "NA"
  gpr_value_fmt: "{:.2f}"

  # Visual parameters
  fig_size: [7, 6]
  title_fontsize: 13
  label_fontsize: 12
  tick_fontsize: 10
  annotation_fontsize: 11

# ============================================================================
# MERGING PATHWAYS&METABOLITES
# ============================================================================

pathway_merging:
  
  "Central Energy Metabolism":
    - "Glycolysis/Gluconeogenesis"
    - "Pyruvate Metabolism"
    - "Citric Acid Cycle"

  "Redox & Pentose Metabolism":
    - "Pentose Phosphate Pathway"
    - "Pentose And Glucuronate Interconversions"
    - "Glutathione Metabolism"
  
  "Lipid metabolism":
    - "Fatty Acid Biosynthesis"
    - "Fatty Acid Degradation"
    - "Fatty Acid Metabolism" 
    - "Triacylglycerol Synthesis"
    - "Synthesis And Degradation Of Ketone Bodies"
    - "Cholesterol Metabolism"
    - "Glycerophospholipid Metabolism"
    - "Sphingolipid Metabolism"

  "BCAA metabolism (Val/Leu/Iso)":
    - "Valine, Leucine And Isoleucine Biosynthesis"
    - "Valine, Leucine And Isoleucine Degradation"
 
  "AAA metabolism (Trp/Phe/Tyr)":
    - "Phenylalanine, Tyrosine And Tryptophan Biosynthesis"
    - "Phenylalanine Metabolism"
    - "Tryptophan Metabolism"

  "AA other":
    - "Cysteine And Methionine Metabolism"
    - "Lysine Degradation"
    - "Arginine Biosynthesis"
    - "Butanoate Metabolism"
    - "Alanine, Aspartate And Glutamate Metabolism"
    - "Glycine, Serine And Threonine Metabolism"
    - "Biosynthesis Of Amino Acids"  

  "Nitrogen disposal":
    - "Nitrogen Metabolism"
    - "Urea Cycle"
    - "Purine Metabolism" 
  
  "Nucleotide metabolism":
    - "Purine Synthesis"
    - "Pyrimidine Synthesis"
    - "Pyrimidine Metabolism"
    - "Pyrimidine Catabolism"
    - "Nucleotide Interconversion"
    - "Nucleotide Metabolism" 

  "Mitochondrial transport":
    - "Transport, Mitochondrial"
  

  


pathway_filter:
  mode: "whitelist"
  whitelist:
    - "Central Energy Metabolism"
    - "Oxidative Phosphorylation"
    - "Redox & Pentose Metabolism"
    - "Lipid metabolism"
    - "BCAA metabolism (Val/Leu/Iso)"
    - "AAA metabolism (Trp/Phe/Tyr)"
    - "AA other"
    - "Nucleotide metabolism"
    - "Folate Metabolism"
    - "Nitrogen disposal"
    - "Mitochondrial transport"
    - "Extracellular Transport" 


metabolite_filter:
  mode: "blacklist"        # "whitelist", "blacklist", or "none"
  whitelist: []
  blacklist: [H, H2O, CO2, HPO4, PPi, Guanosine, Creatinine, Creatine, HCO3]

